[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seedsource-crisol"
version = "0.1.0"
description = "Zero-bloat heterogeneous compute dispatcher and benchmark runner with immutable JSONL audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Seedsource" }]
keywords = ["benchmark", "compute", "dispatcher", "jsonl", "harness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.scripts]
crisol = "crisol:main"
sscri = "crisol:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["crisol*"]
